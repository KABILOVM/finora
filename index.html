<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Масштабирование НЕ запрещаем (доступность). viewport-fit=cover — чтобы работали safe-area на iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Finora — учёт денег</title>
    <meta name="description" content="Личный учёт расходов и доходов. Работает без интернета." />

    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- iOS: запуск с экрана «Домой» как приложение -->

    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <body>
