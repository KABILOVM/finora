<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Политика безопасности страницы (CSP): запрещает всё, что не перечислено. Если кто-то сумеет подсунуть в страницу
      чужой скрипт (XSS), браузер его не выполнит, а токен входа Supabase (лежит в localStorage) не уйдёт на чужой сервер.
      Это ПОЛНАЯ политика. Заголовок из vercel.json добавляет к ней только frame-ancestors 'none' (в <meta> эта директива
      не работает); браузер применяет оба вместе, и действует более строгое из двух.
      Две метки внутри content ниже заменяет плагин finoraCsp в vite.config.ts (при сборке и в `npm run dev`), руками их не трогать:
        метка SUPABASE_CONNECT (между двойными «@») — точные адреса Supabase из VITE_SUPABASE_URL: `https://<хост>` и `wss://<хост>`. Если облака нет
          (переменных нет или в них заготовки из .env.example), адресов Supabase в политике нет вовсе. Подстановки *.supabase.co
          нет нарочно: с ней при XSS данные можно было бы выгрузить в ЧУЖОЙ проект Supabase, а свой домен Supabase
          (не *.supabase.co) браузер блокировал бы. Сменили VITE_SUPABASE_URL — нужна новая сборка.
        метка DEV_STYLE (между двойными «@») — `'unsafe-inline'` для стилей ТОЛЬКО в `npm run dev`: там Vite вставляет CSS тегом <style>, и при
          строгой политике страница в разработке остаётся без стилей (проверено). В сборке стили лежат файлом, а React ставит
          style={{…}} через CSSOM (element.style.x = …), которое политика не блокирует (проверено в браузере на всех экранах),
          поэтому в сборке style-src строгий: 'self'.
      script-src 'self' — без unsafe-inline/unsafe-eval: в сборке нет встроенных скриптов (Vite и PWA кладут только файлы).
      connect-src: nbt.tj, jsdelivr.net, currency-api.pages.dev — курсы валют (src/rates); api.open-meteo.com, geocoding-api.open-meteo.com — погода (src/features/weather).
      Тест e2e/sec/csp.spec.ts проверяет и этот файл, и собранный результат.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'@@DEV_STYLE@@; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'@@SUPABASE_CONNECT@@ https://www.nbt.tj https://cdn.jsdelivr.net https://latest.currency-api.pages.dev https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Адрес приложения не уходит в запросах к источникам курсов и по ссылкам (дублирует заголовок Referrer-Policy из vercel.json). -->
    <meta name="referrer" content="no-referrer" />
    <!-- Масштабирование НЕ запрещаем (доступность). viewport-fit=cover — чтобы работали safe-area на iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Sumoima — учёт денег</title>
    <meta name="description" content="Личный учёт расходов и доходов. Работает без интернета." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eceefb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080a18" media="(prefers-color-scheme: dark)" />

    <!-- iOS: запуск с экрана «Домой» как приложение -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sumoima" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы Sumoima нужен включённый JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
